<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="http://product-artwork.test/">
<title>FNLLA product media - {{LABEL}}</title>
<style>
@font-face { font-family: 'Space Grotesk'; font-weight: 400; src: url('/branding/assets/fonts/SpaceGrotesk-Regular.ttf'); }
@font-face { font-family: 'Space Grotesk'; font-weight: 600; src: url('/branding/assets/fonts/SpaceGrotesk-SemiBold.ttf'); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 600; src: url('/branding/assets/fonts/JetBrainsMono-SemiBold.ttf'); }
:root { {{COLOR_TOKENS}}; }
* { box-sizing: border-box; letter-spacing: 0; }
html, body { width: 1920px; height: 1080px; margin: 0; overflow: hidden; }
body { font: 400 24px 'Space Grotesk', sans-serif; color: var(--ink); background: var(--white); }
.artboard { width: 1920px; height: 1080px; border-top: 8px solid var(--blue); position: relative; }
.top { position: absolute; top: 34px; left: 72px; right: 72px; height: 160px; }
.eyebrow { margin: 0 0 12px; font: 600 20px 'JetBrains Mono', monospace; color: var(--blue); }
.headline { margin: 0; font-size: 56px; font-weight: 600; line-height: 1.16; width: 1430px; height: 66px; }
.subtitle { margin: 12px 0 0; font-size: 27px; line-height: 1.3; width: 1460px; height: 37px; color: var(--text); }
.wordmark { position: absolute; top: 11px; right: 0; width: 240px; height: auto; }
.stage { position: absolute; left: 0; right: 0; top: 220px; height: 770px; background: var(--campaign-surface); border-block: 1px solid var(--border); }
.signature { position: absolute; width: 500px; height: 330px; object-fit: contain; bottom: 28px; right: 0; opacity: .5; }
.viewport { position: absolute; inset: 24px 72px; display: flex; align-items: center; justify-content: center; }
.product-shot { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 6px 18px #0B122012; }
.bottom { position: absolute; top: 1010px; left: 72px; right: 72px; display: grid; grid-template-columns: 1fr auto; gap: 16px; }
.disclosure { margin: 0; font-size: 18px; color: var(--supporting-text); height: 26px; }
.credit { margin: 4px 0 0; font-size: 18px; height: 25px; color: var(--text); }
.edition { margin: 0; font: 600 19px 'JetBrains Mono', monospace; color: var(--blue); text-align: right; }
.domain { display: block; margin-top: 5px; font-size: 22px; }
</style>
</head>
<body>
<main class="artboard">
  <header class="top">
    <p class="eyebrow">{{NUMBER}} / {{LABEL}}</p>
    <h1 class="headline">{{TITLE}}</h1>
    <p class="subtitle">{{SUBTITLE}}</p>
    <img class="wordmark" src="/branding/assets/logo/outline/wordmark-blue.svg" alt="FNLLA">
  </header>
  <section class="stage" aria-label="Actual framework interface">
    <img class="signature" src="/branding/assets/patterns/binary-field.png" alt="">
    <div class="viewport">
      <img class="product-shot" src="/branding/assets/social/linkedin-product/screenshots/{{SCREEN}}-detail.png" alt="FNLLA {{LABEL}} in an isolated demonstration project">
    </div>
  </section>
  <footer class="bottom">
    <div>
      <p class="disclosure">{{DISCLOSURE}}</p>
      <p class="credit">Web framework. PHP foundation. Created &amp; maintained by TechAyo.</p>
    </div>
    <p class="edition">FNLLA {{EDITION}}<span class="domain">fnlla.com</span></p>
  </footer>
</main>
</body>
</html>
