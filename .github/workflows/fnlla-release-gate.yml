name: FNLLA Release Gate

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: https://fnlla.example
      TRUSTED_HOSTS: fnlla.example
      TRUSTED_PROXIES: 127.0.0.1
      SECURITY_HEADERS_PRESET: strict
      MAIL_MAILER: http
      MAIL_HTTP_ENDPOINT: https://mail.fnlla.example/send
      MAIL_HTTP_ALLOWED_HOSTS: mail.fnlla.example
      FNLLA_RUNTIME_AUTO_SYNC: false
      FNLLA_RUNTIME_ENFORCE: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, fileinfo
          coverage: none

      - name: Show PHP version
        shell: pwsh
        run: php -v

      - name: Install locked development dependencies
        shell: pwsh
        run: composer install --no-interaction --prefer-dist

      - name: Audit locked dependencies
        shell: pwsh
        run: composer audit --locked

      - name: Run full framework acceptance
        shell: pwsh
        run: php vendor/phpunit/phpunit/phpunit --testsuite framework --fail-on-skipped

      - name: Validate docs sync
        shell: pwsh
        run: php ./scripts/build-docs.php --check

      - name: Validate runtime contract
        shell: pwsh
        run: php ./scripts/validate-fnlla-runtime.php

      - name: Validate version manifest
        shell: pwsh
        run: php ./scripts/validate-version-manifest.php

      - name: Validate release metadata
        shell: pwsh
        run: php ./scripts/validate-release-metadata.php

      - name: Run Composer test script
        shell: pwsh
        run: composer run test -- --suite fast

      - name: Run runtime doctor
        shell: pwsh
        run: php ./fnlla doctor

      - name: Run security audit
        shell: pwsh
        run: php ./fnlla security:audit --strict

      - name: Generate backup and restore plan
        shell: pwsh
        run: php ./fnlla ops:backup-plan --verify --output=framework/backup-plan.json

      - name: Run project acceptance smoke checks
        shell: pwsh
        run: php ./fnlla project:acceptance --json

      - name: Run performance release budget
        shell: pwsh
        run: |
          php ./fnlla perf:profile --iterations=1 --write-baseline
          php ./fnlla perf:budget --iterations=1 --max-regression=20 --max-regression-ms=1000

      - name: Run Composer lint script
        shell: pwsh
        run: composer run lint

      - name: Generate release supply-chain artifacts
        shell: pwsh
        run: php ./fnlla release:prepare --skip-tests

      - name: Publish runtime export
        shell: pwsh
        run: ./scripts/publish-fnlla-runtime.ps1

      - name: Audit ecosystem contract
        shell: pwsh
        run: ./scripts/audit-fnlla-ecosystem.ps1 -SkipLocalChecks

      - name: Upload published runtime export
        uses: actions/upload-artifact@v4
        with:
          name: fnlla-runtime-export-${{ matrix.os }}
          path: dist/fnlla-runtime
          if-no-files-found: error

      - name: Upload release supply-chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fnlla-release-supply-chain-${{ matrix.os }}
          path: dist/release
          if-no-files-found: error

  export-regression:
    name: Export regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    env:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: https://fnlla.example
      TRUSTED_HOSTS: fnlla.example
      TRUSTED_PROXIES: 127.0.0.1
      SECURITY_HEADERS_PRESET: strict
      MAIL_MAILER: http
      MAIL_HTTP_ENDPOINT: https://mail.fnlla.example/send
      MAIL_HTTP_ALLOWED_HOSTS: mail.fnlla.example
      FNLLA_RUNTIME_AUTO_SYNC: false
      FNLLA_RUNTIME_ENFORCE: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, fileinfo
          coverage: none

      - name: Run export and update regression tests
        shell: pwsh
        run: php ./scripts/test.php --suite slow

      - name: Verify 2.0.3 export and 2.1 update readiness
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "fnlla-update-path"
          New-Item -ItemType Directory -Force $work | Out-Null
          php ./fnlla make:project (Join-Path $work "app-current") "FNLLA Current Export"
          php (Join-Path $work "app-current" "fnlla") project:acceptance --json
          git worktree add (Join-Path $work "source-2.0.3") v2.0.3
          php (Join-Path $work "source-2.0.3" "fnlla") make:project (Join-Path $work "app-2.0.3") "FNLLA Update Path"
          php ./fnlla upgrade:check --target=2.1.3

  release-assets:
    name: Attach release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-gate
      - export-regression
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: https://fnlla.example
      TRUSTED_HOSTS: fnlla.example
      TRUSTED_PROXIES: 127.0.0.1
      SECURITY_HEADERS_PRESET: strict
      MAIL_MAILER: http
      MAIL_HTTP_ENDPOINT: https://mail.fnlla.example/send
      MAIL_HTTP_ALLOWED_HOSTS: mail.fnlla.example
      FNLLA_RUNTIME_AUTO_SYNC: false
      FNLLA_RUNTIME_ENFORCE: true
      RELEASE_SIGNING_KEY: ${{ secrets.FNLLA_RELEASE_SIGNING_KEY }}
      RELEASE_SIGNING_KEY_ID: ${{ vars.FNLLA_RELEASE_SIGNING_KEY_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, fileinfo
          coverage: none

      - name: Generate release supply-chain assets
        shell: pwsh
        run: php ./fnlla release:prepare --skip-tests

      - name: Attach supply-chain assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "${tag}" >/dev/null 2>&1 || gh release create "${tag}" --title "${tag}" --notes "FNLLA ${tag} release assets."
          gh release upload "${tag}" \
            dist/release/fnlla-sbom.cdx.json \
            dist/release/SHA256SUMS \
            dist/release/fnlla-release-manifest.json \
            --clobber
