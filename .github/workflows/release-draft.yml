name: FNLLA Release Draft

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved stable tag (for example v2.2.0)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: fnlla-release-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact-commit CI and prepare a private draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release/prepare-draft.mjs
