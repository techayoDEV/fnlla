name: FNLLA Core Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, fileinfo, mbstring, dom, xml
          coverage: none
      - name: Extract the exact commit without private storage or design masters
        shell: bash
        run: |
          git archive --format=zip --output="${{ runner.temp }}/fnlla-source.zip" HEAD
          unzip -q "${{ runner.temp }}/fnlla-source.zip" -d "${{ runner.temp }}/fnlla-source"
          test ! -e "${{ runner.temp }}/fnlla-source/.env"
          test ! -e "${{ runner.temp }}/fnlla-source/storage"
          test ! -e "${{ runner.temp }}/fnlla-source/branding"
          test ! -e "${{ runner.temp }}/fnlla-source/scripts/branding"
      - run: composer install --no-interaction --prefer-dist
        working-directory: ${{ runner.temp }}/fnlla-source
      - run: composer audit --locked
        working-directory: ${{ runner.temp }}/fnlla-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/release/*.test.mjs
        working-directory: ${{ runner.temp }}/fnlla-source
      - run: php fnlla release:prepare --json
        working-directory: ${{ runner.temp }}/fnlla-source
      - uses: actions/upload-artifact@v4
        with:
          name: accepted-source-archive
          path: |
            ${{ runner.temp }}/fnlla-source.zip
            ${{ runner.temp }}/fnlla-source/dist/release/
          retention-days: 14

  production-http:
    needs: source-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install the production HTTP test stack
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx php8.3-cli php8.3-fpm php8.3-curl php8.3-mbstring php8.3-xml php8.3-mysql php8.3-sqlite3
      - uses: actions/download-artifact@v4
        with:
          name: accepted-source-archive
          path: ${{ runner.temp }}/fnlla-http-input
      - name: Accept the downloaded starter on HTTPS and PHP-FPM
        run: bash scripts/acceptance/fpm.sh "${{ runner.temp }}/fnlla-http-input/fnlla-source.zip"

  brand-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, fileinfo, mbstring, dom, xml
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: php scripts/branding/build-runtime.php --check
      - run: php fnlla make:project "${{ runner.temp }}/brand-complete" "Brand Regression" --profile=full
      - run: php scripts/branding/ui-fixtures.php "${{ runner.temp }}/brand-complete" "${{ runner.temp }}/brand-fixtures"
      - run: python scripts/branding/check-ui.py "${{ runner.temp }}/brand-complete" "${{ runner.temp }}/brand-fixtures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brand-ui
          path: |
            ${{ runner.temp }}/brand-fixtures/results.json
            ${{ runner.temp }}/brand-fixtures/screenshots/
          if-no-files-found: warn
          retention-days: 14

  php:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3', '8.4', '8.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, fileinfo, mbstring, dom, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked
      - run: composer test:unit -- --testsuite framework "--log-junit=${{ runner.temp }}/junit-framework.xml"
      - run: composer analyse
      - run: php scripts/check-modernization.php
      - run: php scripts/check-docs.php
      - run: composer lint
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-${{ matrix.os }}-php-${{ matrix.php }}
          path: ${{ runner.temp }}/junit-framework.xml
          if-no-files-found: warn
          retention-days: 14

  services:
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration-only
          MYSQL_DATABASE: fnlla_test_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      FNLLA_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=fnlla_test_ci;charset=utf8mb4
      FNLLA_TEST_MYSQL_USER: root
      FNLLA_TEST_MYSQL_PASSWORD: integration-only
      FNLLA_TEST_REDIS_HOST: 127.0.0.1
      FNLLA_TEST_REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, redis, fileinfo, mbstring, dom, xml
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --locked
      - run: git clone --depth 1 --branch v2.1.3 https://github.com/techayoDEV/fnlla.git "${{ runner.temp }}/fnlla-previous"
      - run: composer test:unit -- --testsuite integration --fail-on-skipped "--log-junit=${{ runner.temp }}/junit-integration.xml"
        env:
          FNLLA_TEST_PREVIOUS_SOURCE: ${{ runner.temp }}/fnlla-previous
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-redis-integration-php-${{ matrix.php }}
          path: ${{ runner.temp }}/junit-integration.xml
          if-no-files-found: warn
          retention-days: 14
